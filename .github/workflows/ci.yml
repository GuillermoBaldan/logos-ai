name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  backend:
    name: Backend Lint/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: |
          if [ -f package.json ]; then npm ci; else echo "No backend"; fi
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "No backend"; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "No backend"; fi

  frontend:
    name: Frontend Lint/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package.json ]; then npm ci; else echo "No frontend"; fi
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "No frontend"; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "No frontend"; fi