name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  backend:
    name: Backend (Node.js + Express + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "Backend not initialized yet"; fi
      - name: TypeScript check
        run: |
          if [ -f package.json ]; then npm run type-check --if-present; else echo "Backend not initialized yet"; fi
      - name: Lint (ESLint)
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "Backend not initialized yet"; fi
      - name: Run tests
        run: |
          if [ -f package.json ]; then npm run test --if-present; else echo "Backend not initialized yet"; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "Backend not initialized yet"; fi

  frontend:
    name: Frontend (React + TypeScript + Bootstrap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "Frontend not initialized yet"; fi
      - name: TypeScript check
        run: |
          if [ -f package.json ]; then npm run type-check --if-present; else echo "Frontend not initialized yet"; fi
      - name: Lint (ESLint + React rules)
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "Frontend not initialized yet"; fi
      - name: Run tests (React Testing Library)
        run: |
          if [ -f package.json ]; then npm run test --if-present; else echo "Frontend not initialized yet"; fi
      - name: Build (Vite)
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "Frontend not initialized yet"; fi